name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints-tested.txt
      - name: Check public source files
        run: python tools/check_public_source.py --tracked
      - name: Python tests
        run: python -m pytest tests --basetemp tmp/ci -q
      - name: Frontend tests
        run: node --test tests/test_document_jobs_frontend.cjs
